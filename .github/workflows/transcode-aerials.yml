name: Transcode Aerials

# Triggered by the ALOFT pipeline (video_agent/aloft_pipeline.py)
# pushing a pending_aerials/<slug>.json manifest. The pipeline
# container can't reach googlevideo.com and the Claude GitHub App
# doesn't carry actions:write, so dispatch is done by push: the
# pipeline writes the manifest + commits + pushes, this workflow
# fires on the push, downloads each URL on GitHub infrastructure,
# re-encodes with ffmpeg to standard H.264 1080x1920 MP4 (so
# Everygen's Remotion compose_video can decode it — raw Google
# Aerial DASH-fragmented MP4 fails there), drops results into
# <slug>/aerials/, deletes the manifest, and pushes.

on:
  push:
    paths:
      - 'pending_aerials/*.json'

jobs:
  transcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to diff for changed manifests

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Verify tools
        run: ffmpeg -version | head -1 && jq --version

      - name: Find pending manifests
        id: find
        run: |
          # List manifests that this push added or changed.
          files=$(git diff --name-only HEAD~1 HEAD -- 'pending_aerials/*.json' || true)
          if [ -z "$files" ]; then
            echo "No pending manifests touched by this push; nothing to do."
            echo "do_transcode=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_transcode=true" >> "$GITHUB_OUTPUT"
            echo "manifests<<EOF" >> "$GITHUB_OUTPUT"
            echo "$files" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Process manifests
        if: steps.find.outputs.do_transcode == 'true'
        env:
          MANIFESTS: ${{ steps.find.outputs.manifests }}
        run: |
          # Run inside this subshell with everything tee'd into a log
          # we commit after, so a failure surfaces even without the
          # ability to pull workflow run logs out of GitHub storage.
          set +e
          exec > >(tee -a transcode_debug.log) 2>&1
          set -xuo pipefail

          echo "MANIFESTS payload: [$MANIFESTS]"
          echo "---"

          overall_rc=0
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            if [ ! -f "$manifest" ]; then
              echo "WARN: $manifest not on disk, skipping"
              continue
            fi
            echo "=== $manifest ==="
            cat "$manifest" || true

            slug=$(jq -r '.slug' "$manifest")
            n=$(jq -r '.aerials | length' "$manifest")
            mkdir -p "${slug}/aerials"

            for i in $(seq 0 $((n - 1))); do
              name=$(jq -r ".aerials[$i].name" "$manifest")
              url=$(jq -r ".aerials[$i].url" "$manifest")
              raw="/tmp/raw_${name}.mp4"
              echo "[${name}] downloading…"
              curl -fsSL -o "$raw" "$url"
              rc=$?
              echo "[${name}] curl exit=$rc"
              [ $rc -ne 0 ] && { overall_rc=$rc; echo "SKIP transcode"; continue; }
              ls -la "$raw"
            done

            for i in $(seq 0 $((n - 1))); do
              name=$(jq -r ".aerials[$i].name" "$manifest")
              raw="/tmp/raw_${name}.mp4"
              out="${slug}/aerials/${name}.mp4"
              ref="${slug}/aerials/${name}_v2v_ref.mp4"
              echo "[${name}] transcoding full → $out"
              ffmpeg -y -nostdin -loglevel error -i "$raw" \
                -c:v libx264 -preset fast -crf 20 \
                -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,setsar=1" \
                -pix_fmt yuv420p -r 30 -an \
                -movflags +faststart \
                "$out"
              rc=$?
              echo "[${name}] full ffmpeg exit=$rc"
              [ $rc -ne 0 ] && overall_rc=$rc

              # Also emit an 8-second trim of the middle of the clip
              # (Google aerials start with a static establishing shot,
              # motion picks up around t=4s). This is the reference
              # Minimax H3 uses to preserve camera motion when
              # regenerating the clip in cinematic golden-hour look.
              echo "[${name}] trimming v2v reference → $ref"
              ffmpeg -y -nostdin -loglevel error -ss 4 -t 8 -i "$raw" \
                -c:v libx264 -preset fast -crf 20 \
                -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,setsar=1" \
                -pix_fmt yuv420p -r 30 -an \
                -movflags +faststart \
                "$ref"
              rc=$?
              echo "[${name}] trim ffmpeg exit=$rc"
              [ $rc -ne 0 ] && overall_rc=$rc
            done

            ls -la "${slug}/aerials"
            [ $overall_rc -eq 0 ] && git rm "$manifest"
          done <<< "$MANIFESTS"
          echo "overall_rc=$overall_rc"
          exit $overall_rc

      - name: Commit + push (always, so debug log is pushed on failure too)
        if: always() && steps.find.outputs.do_transcode == 'true'
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "ALOFT transcoder"
          # Keep debug log inside the repo so we can read it afterwards.
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "aerials: transcoded [skip ci]"
          git pull --rebase origin main
          git push
